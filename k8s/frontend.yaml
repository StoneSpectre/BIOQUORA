apiVersion: apps/v1
kind: Deployment
metadata:
  name: bioquora-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bioquora-frontend
  template:
    metadata:
      labels:
        app: bioquora-frontend
    spec:
      containers:
      - name: frontend
        image: bioquora/frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bioquora-frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: bioquora-frontend
