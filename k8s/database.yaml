apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bioquora-db
spec:
  serviceName: "bioquora-db"
  replicas: 1
  selector:
    matchLabels:
      app: bioquora-db
  template:
    metadata:
      labels:
        app: bioquora-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "bioquora"
        - name: POSTGRES_PASSWORD
          value: "bioquora_password"
        - name: POSTGRES_DB
          value: "bioquora_db"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: db-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bioquora-db
spec:
  ports:
  - port: 5432
  selector:
    app: bioquora-db
