apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bioquora-qdrant
spec:
  serviceName: "bioquora-qdrant"
  replicas: 1
  selector:
    matchLabels:
      app: bioquora-qdrant
  template:
    metadata:
      labels:
        app: bioquora-qdrant
    spec:
      containers:
      - name: qdrant
        image: qdrant/qdrant:latest
        ports:
        - containerPort: 6333
        - containerPort: 6334
        volumeMounts:
        - name: qdrant-data
          mountPath: /qdrant/storage
  volumeClaimTemplates:
  - metadata:
      name: qdrant-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bioquora-qdrant
spec:
  ports:
  - name: http
    port: 6333
  - name: grpc
    port: 6334
  selector:
    app: bioquora-qdrant
