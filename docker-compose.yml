version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: bioquora
      POSTGRES_PASSWORD: bioquora_password
      POSTGRES_DB: bioquora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://bioquora:bioquora_password@db:5432/bioquora_db
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - db
      - qdrant

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
