version: '3.8'

services:
  # ==========================================
  # 1. Transactional Metadata & Ontology Catalog
  # ==========================================
  biodos-metadata:
    image: postgres:16-alpine
    container_name: biodos-metadata
    environment:
      POSTGRES_USER: bioquora_admin
      POSTGRES_PASSWORD: SecretVaultPassword2026
      POSTGRES_DB: biodos_catalog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - biodos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bioquora_admin -d biodos_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Biomedical Knowledge Graph (LPG / Neo4j)
  # ==========================================
  biodos-graph:
    image: neo4j:5.12-enterprise
    container_name: biodos-graph
    environment:
      - NEO4J_AUTH=neo4j/SecretGraphPassword2026
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc", "gds"]
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    networks:
      - biodos-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================
  # 3. Semantic RAG & Vector Embedding Store
  # ==========================================
  biodos-vector:
    image: qdrant/qdrant:v1.8.0
    container_name: biodos-vector
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    networks:
      - biodos-network

  # ==========================================
  # 4. Lexical Search Engine (BM25 / OpenSearch)
  # ==========================================
  biodos-search:
    image: opensearchproject/opensearch:2.11.0
    container_name: biodos-search
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    networks:
      - biodos-network

  # ==========================================
  # 5. Event Bus & High-Speed Cache
  # ==========================================
  biodos-cache:
    image: redis:7-alpine
    container_name: biodos-cache
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - biodos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================
  # 6. S3-Compatible Object Lakehouse (MinIO)
  # ==========================================
  biodos-lakehouse:
    image: minio/minio:RELEASE.2023-11-20T22-40-07Z
    container_name: biodos-lakehouse
    environment:
      MINIO_ROOT_USER: bioquora_admin
      MINIO_ROOT_PASSWORD: SecretVaultPassword2026
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - biodos-network

  # ==========================================
  # 7. BioDOS Core Application API Service
  # ==========================================
  biodos-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biodos-api
    environment:
      DATABASE_URL: postgresql+psycopg://bioquora_admin:SecretVaultPassword2026@biodos-metadata:5432/biodos_catalog
      NEO4J_URI: bolt://biodos-graph:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: SecretGraphPassword2026
      QDRANT_HOST: biodos-vector
      OPENSEARCH_HOST: biodos-search
      REDIS_URL: redis://biodos-cache:6379/0
      S3_ENDPOINT: http://biodos-lakehouse:9000
    ports:
      - "8000:8000"
    depends_on:
      biodos-metadata:
        condition: service_healthy
      biodos-cache:
        condition: service_healthy
    networks:
      - biodos-network

volumes:
  pgdata:
  neo4jdata:
  qdrantdata:
  osdata:
  redisdata:
  miniodata:

networks:
  biodos-network:
    driver: bridge
